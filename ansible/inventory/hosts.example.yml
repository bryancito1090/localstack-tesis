---
all:
  children:
    portal:
      hosts:
        portal_ec2:
          ansible_host: 192.0.2.10
          ansible_connection: ssh
          ansible_user: ec2-user
          ansible_ssh_private_key_file: ~/.ssh/tesis.pem
      vars:
        portal_app_asset_name: tesis-ir-portal-ec2
        cloudwatch_agent_region: us-east-2
        cloudwatch_agent_log_group: /aws/ec2/tesis-ir-portal-app
